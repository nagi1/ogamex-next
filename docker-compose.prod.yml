services:

  # MariaDB Service
  ogamex-db:
    image: mariadb:11.3.2-jammy
    restart: unless-stopped
    tty: true
    volumes:
     - ogame-dbdata:/var/lib/mysql
     - ./mysql/my.cnf:/etc/mysql/my.cnf
    # MariaDB port is not exposed to the host machine in production.
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: toor
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    networks:
      app-network:
        aliases:
          - ogame-db

  # PHP Service
  ogamex-app:
    volumes:
      - ./:/var/www:cached
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPCACHE_ENABLE: "1" # Enable opcache in production
    restart: unless-stopped
    tty: true
    environment:
      CONTAINER_ROLE: app
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      # Redis lives inside the Compose network and the container environment overrides
      # .env, so enabling Horizon only requires QUEUE_CONNECTION=redis.
      REDIS_HOST: ogamex-redis
    working_dir: /var/www
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000 || [ $? -eq 56 ]"]
      interval: 10s
      timeout: 6s
      retries: 60
    networks:
      - app-network
    depends_on:
      - ogamex-db
      - ogamex-redis

  # Nginx Service
  ogamex-webserver:
    image: nginx:alpine
    restart: unless-stopped
    tty: true
    volumes:
      - ./:/var/www:cached
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - ./nginx/ssl/:/etc/nginx/ssl/
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy

  # Scheduler
  ogamex-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www:cached
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: scheduler
      REDIS_HOST: ogamex-redis
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy
      ogamex-redis:
        condition: service_started

  # Queue
  ogamex-queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www:cached
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: queue
      REDIS_HOST: ogamex-redis
      # Fleet-arrival worker pools (database driver only). Horizon ignores these and
      # uses its own pools from config/horizon.php.
      QUEUE_WORKERS_LIGHT: ${QUEUE_WORKERS_LIGHT:-2}
      QUEUE_WORKERS_HEAVY: ${QUEUE_WORKERS_HEAVY:-3}
    healthcheck:
      # Reports the queue container unhealthy when no worker pool or Horizon master is
      # running, whichever backend the entrypoint picked.
      test: ["CMD-SHELL", "sh /var/www/docker/queue-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy
      ogamex-redis:
        condition: service_started

  # Redis, the queue backend Laravel Horizon uses. Always available so enabling Horizon
  # only requires QUEUE_CONNECTION=redis; it is lightweight and idle while the database
  # queue driver is in use.
  ogamex-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - app-network

  # Reverb WebSocket Server
  ogamex-reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www:cached
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: reverb
    ports:
      - "${REVERB_SERVER_PORT:-8090}:${REVERB_SERVER_PORT:-8090}"
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy

  # PhpMyAdmin
  ogamex-phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=ogame-db
      - UPLOAD_LIMIT=1G
    networks:
      - app-network
    volumes:
      - ./docker/phpmyadmin/.htaccess:/var/www/html/.htaccess

# Docker Networks
networks:
  app-network:
    driver: bridge

# Volumes
volumes:
  ogame-dbdata:
    driver: local
