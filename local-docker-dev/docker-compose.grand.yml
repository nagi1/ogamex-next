# Grand test stack — reuses the existing image and codebase, pointed at its own
# database, redis prefixes and Horizon lanes. Nothing here is shared with the dev
# stack except the bind-mounted code and the host-level cognition sidecars.
#
#   docker compose -f local-docker-dev/docker-compose.grand.yml --profile queue up -d
#
name: ogamex-grand

x-grand-env: &grand-env
  APP_ENV: local
  APP_DEBUG: "true"
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ogamex-grand
  DB_USERNAME: root
  DB_PASSWORD: ""
  # The database is reached directly over Docker DNS. Statement emulation stays
  # enabled to preserve the existing local application's behavior.
  DB_EMULATE_PREPARES: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "null"
  REDIS_CLIENT: phpredis
  QUEUE_CONNECTION: redis
  REDIS_QUEUE_RETRY_AFTER: "660"
  CACHE_STORE: redis
  CACHE_PREFIX: ogamex_grand
  HORIZON_PREFIX: "ogamex_grand_horizon:"
  BROADCAST_CONNECTION: log
  SESSION_DRIVER: database
  # Horizon controls the workers; the module's Horizon plan reads these ceilings.
  AI_HORIZON_WORK_PROCESSES: "10"
  AI_HORIZON_WORK_BALANCE: simple
  AI_HORIZON_WORK_TIMEOUT: "300"
  AI_HORIZON_LANGUAGE_PROCESSES: "1"
  AI_POPULATION_SESSION_INTERVAL_SECONDS: "5"
  # Every external driver is the authority here, with native kept only as the per-call
  # fallback an absent or failed sidecar degrades to.
  AI_COGNITION_MODE: external
  AI_COGNITION_DRIVER: fatima
  AI_COGNITION_FATIMA_URLS: http://host.docker.internal:8092,http://host.docker.internal:8095
  AI_EXPERIENCE_DRIVER: cbrkit
  AI_MEMORY_DRIVER: agentos
  # Generative lanes ON for the deepseek off-peak (owner direction 18 Sep 2026, 13:05 UTC; the
  # consultation lane raised observe -> advice for the off-peak window, 20 Sep 2026): the peak
  # windows are 01:00-04:00 and 06:00-10:00 UTC Mon-Fri, so this window is billed at 1x.
  # Consultation now APPLIES a validated, profile-bounded ranking nudge instead of only recording
  # it. AI_ROUTING_ENABLED stays off, so the explicit model pins below remain authoritative.
  # Flip back to false/false/observe when the peak returns.
  AI_LANGUAGE_ENABLED: "true"
  AI_LANGUAGE_MODEL: deepseek-flash
  AI_LANGUAGE_AI_TO_AI: "true"
  AI_CONVERSATION_ENABLED: "true"
  AI_CAMPAIGN_CONSULTATION_MODE: advice
  AI_CAMPAIGN_CONSULTATION_MODEL: deepseek-flash
  # ---- Play universe (sprint 8-10 Nov 2026, owner): every model on, through this file only. ----
  # Module defaults stay unchanged; everything below applies to the `grand` universe alone.
  # Empire module (alliance diplomacy tab) is enabled for this universe through its own statuses file.
  MODULES_STATUSES_FILE: /var/www/local-docker-dev/grand-modules.json
  # Jev classifier through its live API (TYPESAFE_API_KEY comes from the root .env).
  AI_CLASSIFICATION_ENABLED: "true"
  # Engine-driven social teacher: alliance politics read FAtiMA, PsychSim, CBRKit and AgentOS through the gateway.
  AI_SOCIAL_MINDS: "true"
  AI_SOCIAL_CYCLES: "true"
  AI_SOCIAL_HUMAN_PRESSURE: medium
  AI_COGNITION_GATEWAY_URL: http://host.docker.internal:8099
  AI_COGNITION_PSYCHSIM_URL: http://host.docker.internal:8094
  AI_MEMORY_AGENTOS_URL: http://host.docker.internal:8093
  AI_EXPERIENCE_CBRKIT_URL: http://host.docker.internal:8091
  # Fleet errands split per account (config/rl.php): raiders fly the scripted raider, every other archetype
  # (miner, fleeter = the savers) flies the simulator's errand model g16 (feature version 3), run in PHP.
  AI_RL_FLEET_ERRANDS_SCRIPTED_PERSONAS: raider
  AI_RL_ERRAND_MODEL: /var/www/storage/rl/ogsim/runs/es-late-c4/final-g16.policy.json
  # Economy model: best-es3-s10 reads the simulator's 25/14 columns, while the PHP seam sends EconomyChoiceEncoder v4
  # (59/68) and ogrl.serve loads only ONNX: there is no path to serve it yet (blocker), so builds stay on the teacher.
  AI_RL_POLICY: teacher
  # Advisor (DeepSeek) per-area modes (off|observe|advice); also switched in the admin AI settings panel.
  # Costly stays off until the PHP lane's hook lands; the daily call caps keep their defaults.
  AI_ADVISOR_DIPLOMACY_MODE: advice
  AI_ADVISOR_CONVERSATION_MODE: advice
  AI_ADVISOR_OFFENSE_MODE: advice
  AI_ADVISOR_COSTLY_MODE: "off"

services:
  ogamex-app:
    image: ogamex-local-docker-dev:latest
    restart: unless-stopped
    volumes:
      - ..:/var/www
      - ../php/local.ini:/usr/local/etc/php/conf.d/local.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *grand-env
      CONTAINER_ROLE: app
    ports:
      - "9001:9000" # distinct PHP-FPM port; no reverb, no web server
    networks: [grand-network, shared-services]

  ogamex-scheduler:
    image: ogamex-local-docker-dev:latest
    restart: unless-stopped
    volumes:
      - ..:/var/www
      - ../php/local.ini:/usr/local/etc/php/conf.d/local.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *grand-env
      CONTAINER_ROLE: scheduler
    depends_on:
      - ogamex-app
    networks: [grand-network, shared-services]

  ogamex-queue-worker:
    image: ogamex-local-docker-dev:latest
    restart: unless-stopped
    volumes:
      - ..:/var/www
      - ../php/local.ini:/usr/local/etc/php/conf.d/local.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *grand-env
      CONTAINER_ROLE: queue
    profiles: ["queue"]
    depends_on:
      - ogamex-app
    networks: [grand-network, shared-services]

networks:
  grand-network:
    driver: bridge
  shared-services:
    external: true
    name: ogamex-shared-services
