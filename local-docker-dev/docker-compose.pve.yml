# PvE (cooperative campaign) stack — a sibling of docker-compose.grand.yml.
#
# Shares everything it safely can with the grand stack: the same image, the same
# bind-mounted code, the same MySQL server and the same Redis server. Only the
# things that MUST differ do: the database, the cache/queue prefixes, the pubic
# port and the docker network. Nothing here touches the grand stack or ogamex-grand.
#
#   docker compose -f local-docker-dev/docker-compose.pve.yml --profile queue up -d
#
name: ogamex-pve

x-pve-env: &pve-env
  APP_ENV: local
  APP_DEBUG: "true"
  DB_HOST: host.docker.internal
  DB_PORT: "3306"
  DB_DATABASE: ogamex-pve
  DB_USERNAME: root
  DB_PASSWORD: ""
  DB_EMULATE_PREPARES: "true"
  REDIS_HOST: host.docker.internal
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "null"
  REDIS_CLIENT: phpredis
  QUEUE_CONNECTION: redis
  REDIS_QUEUE_RETRY_AFTER: "660"
  # Distinct queue/cache key prefix. CACHE_PREFIX/HORIZON_PREFIX cover the cache and
  # Horizon's own keys, but the QUEUE keys come from REDIS_PREFIX, which is derived
  # from APP_NAME by default and is shared with the grand stack. Two stacks on one
  # Redis with the same queue prefix consume each other's jobs, so this must differ.
  REDIS_PREFIX: ogamex_pve_
  # Distinct prefixes: the two stacks share one Redis server without sharing keys.
  CACHE_STORE: redis
  CACHE_PREFIX: ogamex_pve
  HORIZON_PREFIX: "ogamex_pve_horizon:"
  BROADCAST_CONNECTION: log
  SESSION_DRIVER: database
  AI_HORIZON_WORK_PROCESSES: "10"
  AI_HORIZON_WORK_BALANCE: simple
  AI_HORIZON_WORK_TIMEOUT: "300"
  AI_HORIZON_LANGUAGE_PROCESSES: "1"
  AI_POPULATION_SESSION_INTERVAL_SECONDS: "5"
  # Every external driver is the authority, native kept only as the per-call fallback.
  AI_COGNITION_MODE: external
  AI_COGNITION_DRIVER: fatima
  AI_EXPERIENCE_DRIVER: cbrkit
  AI_MEMORY_DRIVER: agentos
  # Mirrors the grand stack: cheap models only, off-peak, bounded by the module's
  # own daily limits. Consultation runs in `observe` (records, never applies).
  AI_LANGUAGE_ENABLED: "true"
  AI_LANGUAGE_MODEL: deepseek-flash
  AI_CONVERSATION_ENABLED: "true"
  AI_CAMPAIGN_CONSULTATION_MODE: observe
  AI_CAMPAIGN_CONSULTATION_MODEL: deepseek-flash

services:
  ogamex-app:
    image: ogamex-local-docker-dev:latest
    restart: unless-stopped
    volumes:
      - ..:/var/www
      - ../php/local.ini:/usr/local/etc/php/conf.d/local.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *pve-env
      CONTAINER_ROLE: app
    ports:
      - "9002:9000" # distinct PHP-FPM port; no reverb, no web server
    networks: [pve-network]

  ogamex-scheduler:
    image: ogamex-local-docker-dev:latest
    restart: unless-stopped
    volumes:
      - ..:/var/www
      - ../php/local.ini:/usr/local/etc/php/conf.d/local.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *pve-env
      CONTAINER_ROLE: scheduler
    depends_on:
      - ogamex-app
    networks: [pve-network]

  ogamex-queue-worker:
    image: ogamex-local-docker-dev:latest
    restart: unless-stopped
    volumes:
      - ..:/var/www
      - ../php/local.ini:/usr/local/etc/php/conf.d/local.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *pve-env
      CONTAINER_ROLE: queue
    profiles: ["queue"]
    depends_on:
      - ogamex-app
    networks: [pve-network]

networks:
  pve-network:
    driver: bridge
