services:

  # MariaDB Service
  ogamex-db:
    image: mariadb:11.3.2-jammy
    restart: unless-stopped
    tty: true
    volumes:
     - ogame-dbdata:/var/lib/mysql
     - ./mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MARIADB_DATABASE: laravel
      MARIADB_ROOT_PASSWORD: toor
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    networks:
      app-network:
        aliases:
          - ogame-db

  # PHP Service
  ogamex-app:
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPCACHE_ENABLE: "0"  # Disable opcache for development
        USE_USER: ${USE_USER_ARG:-yes}  # Defaults to "yes". Set to "no" for GitHub Actions.
    restart: unless-stopped
    tty: true
    environment:
      CONTAINER_ROLE: app
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      # Redis lives inside the Compose network and the container environment overrides
      # .env, so enabling Horizon only requires QUEUE_CONNECTION=redis.
      REDIS_HOST: ogamex-redis
    working_dir: /var/www
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000 || [ $? -eq 56 ]"]
      interval: 10s
      timeout: 6s
      retries: 60
    networks:
      - app-network
    depends_on:
      - ogamex-db
      - ogamex-redis

  # Scheduler
  ogamex-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: scheduler
      REDIS_HOST: ogamex-redis
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy
      ogamex-redis:
        condition: service_started

  # Queue
  ogamex-queue-worker:
    # Opt-in service: a live worker drains the queue, which would race the test suite
    # (it inspects queued jobs on the same database). Kept out of the default
    # `docker compose up` so CI and a bare local stack have exclusive control of the
    # queue. Start it explicitly to run the workers locally:
    #   docker compose --profile queue up -d
    # The container runs Laravel Horizon when QUEUE_CONNECTION=redis, and the built-in
    # database worker pools otherwise (see docker/entrypoint.sh), so there is never a
    # second queue service to start. Production runs it unconditionally.
    profiles: ["queue"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: queue
      REDIS_HOST: ogamex-redis
      # Fleet-arrival worker pools (database driver only). The light pool is reserved
      # for light traffic (transports, deployments, returns) so it is never blocked by
      # battles; the heavy pool runs battles and backfills light work when idle. More
      # workers = more planet destinations processed in parallel. Horizon ignores these
      # and uses its own pools from config/horizon.php.
      QUEUE_WORKERS_LIGHT: ${QUEUE_WORKERS_LIGHT:-2}
      QUEUE_WORKERS_HEAVY: ${QUEUE_WORKERS_HEAVY:-3}
    healthcheck:
      test: ["CMD-SHELL", "sh /var/www/docker/queue-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy
      ogamex-redis:
        condition: service_started

  # Redis, the queue backend Laravel Horizon uses. Always available so enabling Horizon
  # only requires QUEUE_CONNECTION=redis; it is lightweight and idle while the database
  # queue driver is in use.
  ogamex-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - app-network

  # Nginx Service
  ogamex-webserver:
    image: nginx:alpine
    restart: unless-stopped
    tty: true
    volumes:
      - ./:/var/www:cached
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - ./nginx/ssl/:/etc/nginx/ssl/
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy

  # Reverb WebSocket Server
  ogamex-reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: reverb
    ports:
      - "${REVERB_SERVER_PORT:-8090}:${REVERB_SERVER_PORT:-8090}"
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy

  # PhpMyAdmin
  ogamex-phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=ogame-db
      - UPLOAD_LIMIT=1G
    networks:
      - app-network

# Docker Networks
networks:
  app-network:
    driver: bridge

# Volumes
volumes:
  ogame-dbdata:
    driver: local
