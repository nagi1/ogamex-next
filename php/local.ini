upload_max_filesize=40M
post_max_size=40M
memory_limit=1024M
ffi.enable=true
max_execution_time=300
max_input_time=300
default_socket_timeout=300

; Tests and artisan commands boot the framework per process; a shared CLI opcode cache
; removes that compile cost from every run.
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=32531
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; PCOV is the coverage driver for this project (never Xdebug). It stays disabled for
; normal runs; enable it per command with `php -d pcov.enabled=1`. PCOV's automatic
; source directory stops at the application folder, which would leave the modules
; uninstrumented, so the project root is given explicitly.
pcov.enabled=0
pcov.directory=/var/www
pcov.exclude="~(vendor|node_modules|storage)~"
