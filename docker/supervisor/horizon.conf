; Supervisor configuration for the Laravel Horizon master process.
;
; Horizon runs a single master process that provisions its worker pools from
; config/horizon.php. Those pools mirror the fleet-arrival lanes used by the
; database-driver workers in queue-worker.conf:
;
;   supervisor-default               -> general jobs (AI work, notifications, ...)
;   supervisor-fleet-arrivals-light  -> light traffic (transports, deployments, returns)
;   supervisor-fleet-arrivals-heavy  -> battles first, then backfills the light lane
;
; The queue container runs this file automatically when QUEUE_CONNECTION=redis, and
; queue-worker.conf otherwise (see docker/entrypoint.sh), so operators never have to
; choose a container role. Keep the master under supervisor so it restarts if it exits
; and so `supervisorctl stop horizon` terminates its workers gracefully.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:horizon]
process_name=%(program_name)s
; Worker timeouts, memory limits and queue priorities live in config/horizon.php.
command=php /var/www/artisan horizon --no-interaction
autostart=true
autorestart=true
; Allow the master to deploy/terminate its workers before the container stops.
stopwaitsecs=630
stopsignal=TERM
user=www-data
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
